<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#071017" />
  <title>Mental World Modeling · 从状态识别到动态推理</title>
  <meta name="description" content="Mental World Modeling 论文组内分享交互演示" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="deck" aria-live="polite"></main>
  <div class="chrome">
    <button id="menuBtn" class="icon-btn" aria-label="打开目录">目录</button>
    <div class="mode-switch" role="group" aria-label="内容模式">
      <button data-mode="paper" class="active">论文</button>
      <button data-mode="interpretation">我们的解读</button>
    </div>
    <button id="fullscreenBtn" class="icon-btn" aria-label="全屏">F 全屏</button>
  </div>
  <nav id="progress" aria-label="页面导航"></nav>
  <div id="counter" aria-hidden="true"></div>
  <button id="evidenceBtn" class="evidence-btn">查看论文原文 <span>↗</span></button>

  <aside id="evidenceDrawer" class="drawer" aria-hidden="true" aria-label="论文证据">
    <div class="drawer-head"><div><span class="eyebrow">PAPER EVIDENCE</span><h2>论文证据</h2></div><button id="closeDrawer" aria-label="关闭">×</button></div>
    <div id="evidenceContent" class="drawer-body"></div>
  </aside>
  <div id="scrim" class="scrim"></div>

  <section id="overview" class="overview" aria-hidden="true">
    <div class="overview-head"><div><span class="eyebrow">OVERVIEW</span><h2>15 页演示目录</h2></div><button id="closeOverview">关闭</button></div>
    <div id="overviewGrid" class="overview-grid"></div>
  </section>
  <div id="help" class="help">← → / Space 切页 · O 目录 · F 全屏 · Esc 关闭</div>
  <script type="module" src="app.js"></script>
</body>
</html>
